name: verify

on:
  push:
    branches: [main]
  pull_request:

# ══ مكتفٍ بنفسه، بلا سرّ واحد ══
#
# كان يعتمد على أسرار مستودع تشير إلى مشروع Supabase الحيّ. وهذا عيبان:
# **أوّلهما** أن CI بلا أسرار لا يعمل أصلاً — وقد بقي أحمر منذ أول دفع.
# **وثانيهما** أن اختبارات القاعدة تكتب صفوفاً حقيقية، فكانت كل دورة تلمس
# قاعدة العمل.
#
# فصار يُشغّل نسخة Supabase محلّية في المُشغّل، وتُطبَّق عليها الهجرات من
# المستودع. والنتيجة أصحّ لا أرخص فقط: الأنواع تُقابَل بالهجرات المدفوعة لا
# بحالة مشروع بعيد قد تسبقها أو تتأخّر عنها.

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # مثبَّتة على نسخة المستودع (adr/0017): الأداة تولّد نصّاً مساعداً
      # يتغيّر بين نسخها، فـ`latest` يجعل الأنواع تختلف بلا تغيّر مخطط.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      # يُقلع القاعدة والمصادقة وواجهة REST والتخزين ويُطبّق الهجرات.
      # ما لا تحتاجه الاختبارات يُستثنى: البدء أسرع والسطح أضيق. والتخزين
      # لا يُستثنى منذ مرفق «صوتك» (adr/0054): حاويته وسياساته تُختبر عليه.
      - name: إقلاع Supabase محلّياً
        run: >
          supabase start
          -x realtime,imgproxy,inbucket,studio,edge-runtime,logflare,vector,supavisor,mailpit

      # نسخة التخزين هنا نسخة الأداة لا نسخة الحيّ — فما تعتمد عليه الهجرات
      # يُفحص صراحةً، ويفشل CI بسببٍ مقروء لا بخطأ هجرةٍ غامض.
      - name: فحص مخطط التخزين
        run: |
          DB_URL=$(supabase status -o json | jq -r .DB_URL)
          MISSING=$(psql "$DB_URL" -Atc "
            select string_agg(c, ', ') from unnest(array[
              'buckets.file_size_limit', 'buckets.allowed_mime_types',
              'objects.owner_id', 'objects.metadata'
            ]) c
            where not exists (
              select 1 from information_schema.columns
              where table_schema = 'storage'
                and table_name = split_part(c, '.', 1)
                and column_name = split_part(c, '.', 2)
            )")
          if [ -n "$MISSING" ]; then
            echo "::error::مخطط التخزين ينقصه: $MISSING"
            exit 1
          fi
          psql "$DB_URL" -Atc "select 'آخر هجرة تخزين: ' || name from storage.migrations order by id desc limit 1"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: تثبيت الاعتماديات
        run: pnpm install --frozen-lockfile

      # dotenv-cli يقرأ .env، وهو غير موجود في CI. والقيم من النسخة المحلّية
      # لا من سرّ — مفاتيح التطوير معروفة ومحصورة في المُشغّل.
      - name: تجهيز البيئة
        run: |
          STATUS=$(supabase status -o json)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | jq -r .API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | jq -r .ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r .SERVICE_ROLE_KEY)"
            echo "SUPABASE_DB_URL=$(echo "$STATUS" | jq -r .DB_URL)"
          } > .env

      - name: verify
        run: pnpm verify

      - name: build
        run: pnpm build
