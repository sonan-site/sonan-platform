name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # أسرار المستودع. تُضاف من: Settings > Secrets and variables > Actions
      # قاعدة التطوير لا الإنتاج — verify يشغّل اختبارات قاعدة حقيقية.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # guard-types يُعيد توليد الأنواع ويقابلها بالمُودَع
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: تثبيت الاعتماديات
        run: pnpm install --frozen-lockfile

      # dotenv-cli يقرأ .env، وهو غير موجود في CI — تُمرَّر القيم من الأسرار.
      - name: تجهيز البيئة
        run: |
          printf '%s\n' \
            "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" \
            "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" \
            "SUPABASE_DB_URL=$SUPABASE_DB_URL"             "SUPABASE_ACCESS_TOKEN=$SUPABASE_ACCESS_TOKEN"             "SUPABASE_PROJECT_ID=$SUPABASE_PROJECT_ID" > .env

      - name: verify
        run: pnpm verify

      - name: build
        run: pnpm build
